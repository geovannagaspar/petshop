<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Shop - Orçamento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1> Pet Shop🐾</h1>
    </header>

    <main class="container">

        <h2>Novo Orçamento</h2>

        <form id="formulario">

            <label for="produto">Produto ou serviço:</label>

            <input
                type="text"
                id="produto"
                placeholder="Ex: Banho e Tosa"
            >

            <div class="linha">

                <div>
                    <label for="quantidade">Quantidade:</label>

                    <input
                        type="number"
                        id="quantidade"
                        value="1"
                        min="1"
                    >
                </div>

                <div>
                    <label for="preco">Preço:</label>

                    <input
                        type="number"
                        id="preco"
                        placeholder="Ex: 50"
                        min="0"
                        step="0.01"
                    >
                </div>

            </div>

            <button type="submit">
                Adicionar
            </button>

        </form>

        <h3>Itens do orçamento</h3>

        <table>

            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Total</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="lista">
            </tbody>

        </table>

        <div class="resumo">

            <label for="desconto">
                Desconto (%):
            </label>

            <input
                type="number"
                id="desconto"
                value="0"
                min="0"
                max="100"
            >

            <p>
                Subtotal:
                R$ <span id="subtotal">0.00</span>
            </p>

            <p>
                Desconto:
                R$ <span id="valorDesconto">0.00</span>
            </p>

            <h2>
                Total:
                R$ <span id="total">0.00</span>
            </h2>

        </div>

        <button type="button" id="limpar">
            Limpar orçamento
        </button>

    </main>

    <footer>
        <p>Pet Shop 🐾</p>
    </footer>

    <script src="main.js"></script>

</body>

</html>
